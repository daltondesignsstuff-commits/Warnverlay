<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Warnverlay Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --sidebar-w: 320px;
      --bg1: rgba(80, 10, 10, 0.95);
      --bg2: rgba(120, 20, 20, 0.95);
      --border: rgba(255, 50, 50, 0.55);
      --text: #fff;
    }
    *{ box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body{
      background:#0b0b0b;
      color: var(--text);
      font-family: Arial, sans-serif;
      overflow:hidden;
    }

    @keyframes menu-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 50, 50, 0.6), 0 0 30px rgba(255, 50, 50, 0.3), inset 0 0 20px rgba(255, 50, 50, 0.1); }
      50% { box-shadow: 0 0 25px rgba(255, 50, 50, 0.9), 0 0 40px rgba(255, 50, 50, 0.5), inset 0 0 30px rgba(255, 50, 50, 0.2); }
    }
    @keyframes light-sweep {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .layout{ height:100%; display:flex; }

    /* Sidebar */
    #sidebar{
      width: var(--sidebar-w);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      border-right: 1.5px solid var(--border);
      padding: 14px 14px 10px;
      position: relative;
      overflow:hidden;
      animation: menu-glow 3s ease-in-out infinite;
    }
    #sidebar::before{
      content:"";
      position:absolute; top:0; left:-100%;
      width:100%; height:100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      animation: light-sweep 3s infinite;
      pointer-events:none;
    }
    #sidebar-inner{
      position:relative;
      height:100%;
      overflow:auto;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 50, 50, 0.8) rgba(80, 10, 10, 0.5);
    }
    #sidebar-inner::-webkit-scrollbar{ width: 12px; }
    #sidebar-inner::-webkit-scrollbar-track{ background: rgba(80,10,10,0.5); border-radius: 6px; }
    #sidebar-inner::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg, rgba(255, 100, 100, 0.8), rgba(255, 50, 50, 0.8));
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(255, 50, 50, 0.6), inset 0 0 5px rgba(255, 100, 100, 0.4);
      border: 1px solid rgba(255, 50, 50, 0.6);
    }

    .brand{
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      color: rgba(255, 140, 140, 1);
      text-shadow: 0 0 10px rgba(255, 50, 50, 0.6);
      margin: 2px 0 10px;
    }
    .hint{ font-size: 12px; opacity: .85; margin: 0 0 12px; line-height: 1.35; }

    .menu-group { margin-bottom: 16px; position: relative; z-index: 1; }
    .menu-group h3{
      margin: 10px 0 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.05rem;
      border-bottom: 2px solid rgba(255, 50, 50, 0.6);
      padding-bottom: 5px;
      color: rgba(255, 100, 100, 1);
      text-shadow: 0 0 10px rgba(255, 50, 50, 0.6);
    }

    .row{ display:flex; gap:8px; align-items:center; }
    .row > *{ flex:1; }

    select, input, button{
      width:100%;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 50, 50, 0.45);
      background: rgba(0,0,0,0.25);
      color: #fff;
      padding: 10px 10px;
      outline:none;
    }

    /* Bring over menu toggle styles from the overlay */
    .alert-toggle {
      display: flex; align-items: center;
      cursor: pointer;
      border: 1.5px solid rgba(255, 50, 50, 0.5);
      padding: 8px 12px; margin-bottom: 6px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(150, 50, 50, 0.3), rgba(130, 30, 30, 0.3));
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      user-select:none;
    }
    .alert-toggle:hover {
      border-color: rgba(255, 90, 90, 0.85);
      box-shadow: 0 0 15px rgba(255, 50, 50, 0.35);
      transform: translateY(-1px);
    }
    .toggle-icon {
      width: 52px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, #00ff00, #00cc00);
      color: white;
      display: inline-flex; align-items: center; justify-content: center;
      margin-right: 10px; font-size: 0.75rem;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
      transition: all 0.25s ease;
    }
    .toggle-icon.disabled {
      background: linear-gradient(135deg, #ff3333, #cc0000);
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }
    .alert-toggle.disabled { opacity: 0.85; }

    .outbox {
      margin-top: 10px;
      border-top: 2px solid rgba(255, 50, 50, 0.45);
      padding-top: 12px;
    }
    .outlabel {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.05rem;
      margin: 0 0 6px;
      color: rgba(255, 120, 120, 1);
    }
    .outurl {
      font-size: 12px;
      line-height: 1.3;
      word-break: break-all;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255, 50, 50, 0.35);
      border-radius: 10px;
      padding: 10px;
      min-height: 56px;
    }
    .btnrow{ display:flex; gap:8px; margin-top:8px; }
    .btn{
      cursor:pointer;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.6px;
      background: linear-gradient(135deg, rgba(255, 60, 60, 0.35), rgba(255, 30, 30, 0.25));
    }
    .btn:hover{
      border-color: rgba(255, 120, 120, 0.9);
      box-shadow: 0 0 18px rgba(255, 50, 50, 0.45);
    }

    /* Preview */
    #preview{ flex:1; min-width:0; background:#000; position:relative; }
    #preview iframe{ width:100%; height:100%; border:0; background:#000; }
    #preview-top{
      position:absolute; top:10px; right:10px; z-index:5;
      display:flex; gap:8px; align-items:center;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255, 50, 50, 0.35);
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.5px;
    }
    #preview-top input{ width: 90px; padding: 8px 8px; }

    /* State list grid (keeps it compact) */
    #states-list {
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    #states-list .alert-toggle {
      margin: 0;
      padding: 8px 8px;
      justify-content:center;
    }
    #states-list .toggle-icon { margin-right: 6px; width: 44px; }
  </style>
</head>
<body>

  <div style="font-family: Arial, sans-serif; padding: 24px; max-width: 900px; margin: 0 auto;">
    <h1 style="margin: 0 0 12px;">Warnverlay (Illinois-only)</h1>
    <p style="margin: 0 0 12px;">
      This build is hard-locked to <strong>Illinois</strong> and no longer uses the settings/controller UI.
    </p>

      <li><a href="1080p.html">1080p Overlay</a></li>
      <li><a href="720p.html">720p Overlay</a></li>
      <li><a href="1440p.html">1440p Overlay</a></li>
      <li><a href="2160p.html">2160p Overlay</a></li>
      <li><a href="warnings.html">Pop-up Alerts</a></li>

    </ul>
    <p style="margin-top: 16px;">
      To show a test button, add <code>?test=1</code> to any overlay URL.
    </p>
  </div>

</body>
</html>
